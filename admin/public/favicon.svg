<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B2B"/>
      <stop offset="100%" stop-color="#0F241A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C0"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- RS Monogram Symbol -->
  <g filter="url(#shadow)">
    <text x="64" y="68" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', 'Georgia', serif" font-weight="900" font-size="58" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central" letter-spacing="-3">RS</text>
  </g>
</svg>